<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccwrapped widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*__CSS__*/</style>
</head>
<body class="widget">
  <div class="w-top"><span class="pulse" id="pulse">Tokens today</span><span id="rate"></span></div>
  <div class="w-count" id="count">0</div>
  <div class="w-row">
    <div><b id="allTime">–</b>all time</div>
    <div><b id="cost">–</b>today at API prices</div>
    <div><b id="prompts">–</b>prompts today</div>
  </div>
  <div class="spark" id="spark"></div>
  <div class="w-budget" id="budget" hidden></div>
  <div class="w-last" id="last"></div>
<script>/*__META__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
